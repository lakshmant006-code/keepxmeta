# Render Blueprint: the Keep site plus its Instagram sign-in helper.
# Secrets are never stored here; Render asks for each `sync: false` value in the dashboard.
services:
  - type: web
    name: keepxmeta
    runtime: static
    buildCommand: python3 build.py
    staticPublishPath: dist
    envVars:
      - key: GM_KEY
        sync: false
      - key: IG_APP_ID
        sync: false
      - key: IG_API
        value: https://keep-instagram.onrender.com
      - key: GTAG_ID
        value: G-LR0ZL46FF6
  - type: web
    name: keep-instagram
    runtime: node
    rootDir: worker
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://keepxmeta.onrender.com
      - key: IG_APP_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
